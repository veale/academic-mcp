name: Tests

# Runs the pytest suite on every push and PR. The Docker publish workflow
# builds the image but never exercises the code; this guards the golden
# extraction tests and the search / index logic against regressions.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project with test extras
        # semantic/local-model extras are heavy and network-flaky; the suite
        # is written to degrade gracefully when they are absent, so the base
        # install plus the dev group is what CI needs.
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest -q
